<!--
  Play Store feature graphic: 1024x500, fully opaque (no alpha allowed).
  Content is kept inside the middle so the crops Play applies on some surfaces
  can't cut the wordmark or the mark in half. The mark and colours are
  play/icon.svg's (neon sweep on a near-black body, with bloom), drawn in that
  file's 48-unit coordinates.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="8" y1="41" x2="40" y2="9">
      <stop offset="0%" stop-color="hsl(258 90% 62%)" />
      <stop offset="35%" stop-color="hsl(274 92% 64%)" />
      <stop offset="70%" stop-color="hsl(290 92% 66%)" />
      <stop offset="100%" stop-color="hsl(306 96% 72%)" />
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="hsl(266 32% 13%)" />
      <stop offset="50%" stop-color="hsl(276 34% 9%)" />
      <stop offset="100%" stop-color="hsl(290 38% 8%)" />
    </linearGradient>
    <!-- Bloom behind the mark. -->
    <radialGradient id="bloom" cx="185" cy="230" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="hsl(290 92% 66%)" stop-opacity="0.34" />
      <stop offset="100%" stop-color="hsl(290 92% 66%)" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#body)" />
  <rect width="1024" height="500" fill="url(#bloom)" />

  <!-- Decoration: faint loops, as if other claims sit behind this one. -->
  <g opacity="0.14" transform="translate(860,400) scale(7.5) translate(-25,-24.5)">
    <path d="M12.5 30 L17 15.5 L31 11.5 L38.5 24 L33 36.5 L21.5 37.5 Z" fill="none" stroke="url(#mark)"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <g opacity="0.10" transform="translate(70,70) scale(4) translate(-25,-24.5)">
    <path d="M12.5 30 L17 15.5 L31 11.5 L38.5 24 L33 36.5 L21.5 37.5 Z" fill="none" stroke="url(#mark)"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- The mark. -->
  <g transform="translate(175,250) scale(7) translate(-25,-24.5)">
    <path d="M12.5 30 L17 15.5 L31 11.5 L38.5 24 L33 36.5 L21.5 37.5 Z"
          fill="url(#mark)" fill-opacity="0.2" />
    <path d="M12.5 30 L17 15.5 L31 11.5 L38.5 24 L33 36.5 L25.1 37.2"
          fill="none" stroke="url(#mark)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <circle cx="12.5" cy="30" r="3.6" fill="url(#mark)" />
    <circle cx="21.5" cy="37.5" r="3.6" fill="none" stroke="url(#mark)" stroke-width="2.4" />
  </g>

  <g font-family="Montserrat" fill="#FFFFFF">
    <text x="320" y="232" font-size="100" font-weight="800" letter-spacing="-2">Enclose</text>
    <text x="326" y="288" font-size="30" font-weight="500" opacity="0.92">Walk a loop. Claim the ground inside.</text>
    <text x="326" y="332" font-size="24" font-weight="400" opacity="0.7">Works offline. Nothing leaves your phone.</text>
  </g>
</svg>
